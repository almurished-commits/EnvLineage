name: Bug report
description: Report incorrect EnvLineage behavior
title: "[bug] "
body:
  - type: markdown
    attributes:
      value: "Do not include real secrets or private repository content."
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Provide a sanitized minimal example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
